# Proxmox Datacenter Manager + PVE Cluster Lab
# For use with Docker on Linux/Windows (x86_64)
#
# Usage:
#   docker compose up -d
#
# Access:
#   PDM:      https://localhost:8443
#   PVE-1:    https://localhost:8006
#   PVE-2:    https://localhost:8007
#   PVE-3:    https://localhost:8008

services:
  # Proxmox Datacenter Manager
  pdm:
    image: ghcr.io/longqt-sea/proxmox-datacenter-manager
    platform: linux/amd64
    container_name: pdm
    hostname: pdm
    restart: unless-stopped
    cgroup: host
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    cap_add:
      - ALL
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup
      - ./data/pdm-config:/etc/proxmox-datacenter-manager
      - ./data/pdm-data:/var/lib/proxmox-datacenter-manager
    ports:
      - "8443:8443"
    networks:
      - proxmox_net

  # Proxmox VE Node 1
  pve-1:
    image: ghcr.io/longqt-sea/proxmox-ve
    platform: linux/amd64
    container_name: pve-1
    hostname: pve-1
    privileged: true
    restart: unless-stopped
    cgroup: host
    ports:
      - "2222:22"
      - "3128:3128"
      - "8006:8006"
    networks:
      - proxmox_net
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup
      - /lib/modules:/usr/lib/modules:ro
      - ./data/VM-Backup:/var/lib/vz/dump
      - ./data/ISOs:/var/lib/vz/template/iso

  # Proxmox VE Node 2
  pve-2:
    image: ghcr.io/longqt-sea/proxmox-ve
    platform: linux/amd64
    container_name: pve-2
    hostname: pve-2
    privileged: true
    restart: unless-stopped
    cgroup: host
    ports:
      - "2223:22"
      - "3129:3128"
      - "8007:8006"
    networks:
      - proxmox_net
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup
      - /lib/modules:/usr/lib/modules:ro

  # Proxmox VE Node 3
  pve-3:
    image: ghcr.io/longqt-sea/proxmox-ve
    platform: linux/amd64
    container_name: pve-3
    hostname: pve-3
    privileged: true
    restart: unless-stopped
    cgroup: host
    ports:
      - "2224:22"
      - "3130:3128"
      - "8008:8006"
    networks:
      - proxmox_net
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup
      - /lib/modules:/usr/lib/modules:ro

networks:
  proxmox_net:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/24
        - subnet: fd00::/48
